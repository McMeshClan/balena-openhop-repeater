version: '2.1'

services:
  # CORE SERVICE
  openhop-core:
    build: ./openhop-core
    privileged: true
    restart: always
    volumes:
      - 'openhop-plugins:/app/plugins' # Mount point for downloaded plugins
    environment:
      - OPENHOP_PLUGIN_DIR=/app/plugins
      - OPENHOP_ENABLE_PLUGINS=true
    # If the modem requires separate handling, link it or use network_mode: host

  # If you are using the new decoupled modem layer:
  openhop-modem:
    image: ghcr.io/openhop-dev/openhop_modem:latest
    privileged: true
    restart: always

  # REPEATER SERVICE
  openhop-repeater:
    build: 
      context: .
      args:
        TARGET_HASH: "origin/dev"
        #TARGET_HASH: "dcaa4ac"
    # Added environment variable to try to enable plugin manager, possibly NOT needed
    environment:
      OPENHOP_PLUGIN_MANAGER: "1"
    privileged: true
    cap_add:
      - SYS_RAWIO
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
      - "/dev/spidev0.0:/dev/spidev0.0"
      - "/dev/gpiochip0:/dev/gpiochip0"
    ports:
      - "8000:8000"
      - "8080:8080"
      - "2222:22" #allow inbound ssh
    labels:
      io.balena.features.dbus: '1'
      io.balena.features.supervisor-api: '1'
      io.balena.features.balena-api: '1'
      # Balena uses this label to enable GPIO access
      io.balena.features.gpio: '1'
    volumes:
      - config:/etc/openhop_repeater
      - data:/var/lib/openhop_repeater
    group_add:
      - "plugdev"
      - "gpio"
    restart: always

volumes:
  config:
  data:
  # Added volume for plugins
  openhop-plugins: # Persistent volume for the plugin manager
